name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app is a single static file; CI only needs Node for jsdom + Tailwind.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Fails if the committed index.html was built from stale sources.
      - name: Artifact is reproducible
        run: git diff --exit-code -- index.html
