name: Compile check

# The desktop executor is the one part of this project a browser cannot test, and
# it was written on a machine with no Rust toolchain. This workflow makes GitHub
# the project's compiler rather than a formality: on any push touching src-tauri
# it runs clippy with -D warnings, builds the release binary, and measures it.
#
# Failures are re-emitted as check annotations (scripts/ci/annotate.py) because
# job logs live on storage that is not always reachable — the annotation is the
# error message, on the line that caused it.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/compile-check.yml"
  pull_request:
    paths:
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  # Cheap and fast: the pure logic crate has zero dependencies, so it compiles in
  # seconds and catches the majority of mistakes (types, borrows, moves).
  logic:
    name: Logic crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Compile
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          { cargo build --no-default-features && cargo build; } 2>&1 | tee /tmp/build.log

      - name: Tests
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo test --no-default-features 2>&1 | tee -a /tmp/build.log

      - name: Clippy
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo clippy --no-default-features --all-targets -- -D warnings 2>&1 | tee -a /tmp/build.log

      # rustfmt cannot be run where this code was written, so instead of failing
      # the job forever it publishes a patch. Apply it locally with
      #   git apply rustfmt.patch
      - name: Formatting
        id: fmt
        working-directory: src-tauri/logic
        run: |
          if cargo fmt --check > /tmp/fmt.log 2>&1; then
            echo "already formatted"
            exit 0
          fi
          cargo fmt
          git diff > rustfmt.patch
          python3 - <<'PY'
          # Publish the patch itself as annotations. Artifacts and job logs both
          # live on storage that is not always reachable; annotations are.
          patch = open("rustfmt.patch", encoding="utf-8").read()
          if not patch.strip():
              print("::error::cargo fmt produced no diff, but --check failed")
              raise SystemExit(0)
          size = 4000
          parts = [patch[i:i + size] for i in range(0, len(patch), size)]
          for index, part in enumerate(parts, start=1):
              escaped = (part.replace("%", "%25")
                             .replace("\r", "%0D")
                             .replace("\n", "%0A"))
              print(f"::error::RUSTFMT-PATCH {index}/{len(parts)}%0A{escaped}")
          PY
          exit 1

      - name: Publish diagnostics
        if: failure()
        run: python3 scripts/ci/annotate.py /tmp/build.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rustfmt-patch
          path: src-tauri/logic/rustfmt.patch
          if-no-files-found: ignore

  # Full crate: needs the webview headers, and the frontend must exist because
  # tauri::generate_context! embeds it at compile time.
  shell:
    name: Tauri shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build
      - run: node scripts/embed-web.mjs
      - name: Embedded copy matches dist
        run: node scripts/embed-web.mjs --check

      - name: Compile
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/shell.log

      - name: Build the binary and check its weight
        working-directory: src-tauri
        run: |
          cargo build --release
          BIN=$(find target/release -maxdepth 1 -type f -executable -name 'git-undo-gui*' | head -1)
          ls -lh "$BIN"
          SIZE=$(stat -c%s "$BIN")
          echo "### Desktop binary: $((SIZE/1024/1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt 20971520 ]; then
            echo "::error::binary exceeds the 20 MiB budget promised in the README"
            exit 1
          fi

      - name: Publish diagnostics
        if: failure()
        run: python3 scripts/ci/annotate.py /tmp/shell.log
