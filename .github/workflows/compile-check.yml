name: Compile check

# The desktop executor is the one part of this project that cannot be tested in a
# browser, and it was written on a machine with no Rust toolchain. This workflow
# exists so a rustc actually sees the code on every push: it is the project's
# compiler, not a formality.
#
# Anything that fails here is echoed as a check annotation, so the error text is
# readable from the API (and by a coding agent) without downloading job logs.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src-tauri/**"
      - ".github/workflows/compile-check.yml"
  pull_request:
    paths:
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  # Cheap and fast: the pure logic crate has zero dependencies, so it compiles in
  # seconds and catches the majority of mistakes (types, borrows, moves).
  logic:
    name: Logic crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Compile
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo build --no-default-features 2>&1 | tee /tmp/build.log
          cargo build 2>&1 | tee -a /tmp/build.log

      - name: Tests
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo test --no-default-features 2>&1 | tee -a /tmp/build.log

      - name: Clippy
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo clippy --no-default-features --all-targets -- -D warnings 2>&1 | tee -a /tmp/build.log

      - name: Formatting
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee -a /tmp/build.log

      - name: Publish any failure as an annotation
        if: failure()
        run: |
          python3 - <<'PY'
          import re

          log = open("/tmp/build.log", encoding="utf-8", errors="replace").read()

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          # Keep the diagnostic blocks, drop the "Compiling ..." progress noise.
          blocks = re.split(r"(?m)^(?=error(?:\[|:)|warning: unused)", log)
          picked = [b.rstrip() for b in blocks if b.strip()]

          lines = []
          for block in picked:
              head = block.splitlines()[0]
              where = re.search(r"--> ([^:]+):(\d+):(\d+)", block)
              if where:
                  lines.append(f"::error file={where.group(1)},line={where.group(2)},col={where.group(3)}::{esc(block[:6000])}")
              else:
                  lines.append(f"::error::{esc(block[:6000])}")

          if not lines:
              lines = [f"::error::{esc(log[-6000:])}"]

          print("\n".join(lines))
          PY

  # Full crate: needs the webview headers, and the frontend must exist because
  # tauri::generate_context! embeds it at compile time.
  shell:
    name: Tauri shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - name: Compile
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/shell.log

      - name: Build the binary and check its weight
        working-directory: src-tauri
        run: |
          cargo build --release
          BIN=$(find target/release -maxdepth 1 -type f -executable -name 'git-undo-gui*' | head -1)
          ls -lh "$BIN"
          SIZE=$(stat -c%s "$BIN")
          echo "### Desktop binary: $((SIZE/1024/1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt 20971520 ]; then
            echo "::error::binary exceeds the 20 MiB budget promised in the README"
            exit 1
          fi

      - name: Publish any failure as an annotation
        if: failure()
        run: |
          python3 - <<'PY'
          import re

          log = open("/tmp/shell.log", encoding="utf-8", errors="replace").read()

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          blocks = re.split(r"(?m)^(?=error(?:\[|:)|warning)", log)
          picked = [b.rstrip() for b in blocks if b.strip().startswith(("error", "warning"))]
          lines = []
          for block in picked:
              where = re.search(r"--> ([^:]+):(\d+):(\d+)", block)
              if where:
                  lines.append(f"::error file=src-tauri/{where.group(1)},line={where.group(2)},col={where.group(3)}::{esc(block[:6000])}")
              else:
                  lines.append(f"::error::{esc(block[:6000])}")
          if not lines:
              lines = [f"::error::{esc(log[-6000:])}"]
          print("\n".join(lines))
          PY
