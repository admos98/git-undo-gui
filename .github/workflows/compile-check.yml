name: Compile check

# The desktop executor is the one part of this project that cannot be tested in a
# browser, and it was written on a machine with no Rust toolchain. This workflow
# exists so a rustc actually sees the code on every push: it is the project's
# compiler, not a formality.
#
# Anything that fails here is echoed as a check annotation, so the error text is
# readable from the API (and by a coding agent) without downloading job logs.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src-tauri/**"
      - ".github/workflows/compile-check.yml"
  pull_request:
    paths:
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  # Cheap and fast: the pure logic crate has zero dependencies, so it compiles in
  # seconds and catches the majority of mistakes (types, borrows, moves).
  logic:
    name: Logic crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Compile
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo build --no-default-features 2>&1 | tee /tmp/build.log
          cargo build 2>&1 | tee -a /tmp/build.log

      - name: Tests
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo test --no-default-features 2>&1 | tee -a /tmp/build.log

      - name: Clippy
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo clippy --no-default-features --all-targets -- -D warnings 2>&1 | tee -a /tmp/build.log

      - name: Formatting
        working-directory: src-tauri/logic
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee -a /tmp/build.log

      - name: Publish any failure as an annotation
        if: failure()
        run: |
          python3 - "$GITHUB_REPOSITORY" <<'PY'
          import os, re, sys, urllib.request, json
          log = open("/tmp/build.log", encoding="utf-8", errors="replace").read()
          # Keep the diagnostic blocks, drop the progress noise.
          blocks = re.split(r"(?m)^(?=error\[|error:|warning: unused)", log)
          picked = [b.strip() for b in blocks if b.strip().startswith(("error", "warning: unused"))]
          text = "\n\n---\n\n".join(picked)[:60000] or log[-60000:]
          print(text)
          PY
