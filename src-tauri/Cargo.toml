[package]
name = "git-undo-gui"
version = "1.0.0"
description = "Visual git undo — read your reflog as a timeline and get the safe command"
authors = ["git-undo-gui contributors"]
license = "MIT"
repository = "https://github.com/admos98/git-undo-gui"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
